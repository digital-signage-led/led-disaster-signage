<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防災情報 公開URL一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0e1520;
      color: #e8eef7;
      font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 14px 20px;
      background: #111b2a;
      border-bottom: 1px solid #243247;
    }
    h1 { margin: 0; font-size: 20px; }
    .meta { color: #9fb6d8; font-size: 13px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    input, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid #334861;
      background: #0d1624;
      color: #fff;
      padding: 7px 10px;
    }
    button { background: #2b5bd7; border: 0; font-weight: 700; cursor: pointer; }
    button.ghost { background: #243247; }
    main { padding: 16px 20px 40px; }
    section { margin: 0 0 22px; }
    h2 {
      margin: 0 0 8px;
      font-size: 16px;
      border-left: 4px solid #2b5bd7;
      padding-left: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #243247; padding: 7px 8px; text-align: left; }
    th { color: #9fb6d8; font-weight: 700; }
    a { color: #9ecbff; word-break: break-all; }
    .copy { padding: 5px 8px; font-size: 12px; }
    .bulk {
      padding: 12px 20px 0;
    }
    .bulk textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      line-height: 1.5;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }
    .bulk-actions { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
    .bulk-actions .meta { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>防災情報 公開URL一覧</h1>
    <p class="meta">47都道府県 × 5コンテンツ = 235件</p>
    <div class="filters">
      <input id="q-pref" type="search" placeholder="都道府県検索">
      <select id="q-content"></select>
      <button type="button" id="btn-copy-all">一括コピー</button>
      <button type="button" id="btn-select-all" class="ghost">全選択</button>
      <a href="admin.html"><button type="button" class="ghost">管理画面</button></a>
    </div>
  </header>
  <div class="bulk">
    <div class="bulk-actions">
      <p class="meta" id="bulk-count">235件を下の枠にまとめています。一括コピー、または枠内を全選択して貼り付けできます。</p>
    </div>
    <textarea id="bulk-text" readonly spellcheck="false"></textarea>
  </div>
  <main id="catalog"></main>
  <script type="module" src="js/url-catalog.js"></script>
</body>
</html>
